<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mneme explorer</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1f23; --muted: #6b6f78; --line: #e3e1db; --soft: #efede8;
  --accent: #3b5bdb; --fresh: #e8590c;
  --k-repo: #4c6ef5; --k-concept: #c2255c; --k-project: #2b8a3e; --k-site: #0c8599; --k-post: #e8590c; --k-stage: #5f3dc4; --k-dataset: #a61e4d; --k-account: #868e96; --k-topic: #868e96; --k-owner: #adb5bd; --k-person: #e67700; --k-other: #495057;
  --f-capability: #4c6ef5; --f-taxonomy: #c2255c; --f-peer: #7048e8; --f-lineage: #0c8599; --f-use: #2b8a3e;
  --f-meaning: #e67700; --f-bounds: #e03131; --f-workflow: #5f3dc4; --f-message: #e8590c; --f-mention: #adb5bd; --f-topic: #adb5bd; --f-meta: #ced4da; --f-personal: #f59f00; --f-other: #868e96;
  --b-observed: #2b8a3e; --b-stated: #1971c2; --b-inferred: #9c36b5; --b-imported: #0c8599; --b-intuited: #e67700;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1b1e23; --ink: #e9ecef; --muted: #9aa0a8; --line: #2c3036; --soft: #23272d;
    --accent: #748ffc; --fresh: #ff922b;
    --k-repo: #748ffc; --k-concept: #f06595; --k-project: #51cf66; --k-site: #3bc9db; --k-post: #ff922b; --k-stage: #b197fc; --k-dataset: #f783ac; --k-account: #868e96; --k-topic: #868e96; --k-owner: #5c636a; --k-person: #ffa94d; --k-other: #adb5bd;
    --f-capability: #748ffc; --f-taxonomy: #f06595; --f-peer: #9775fa; --f-lineage: #3bc9db; --f-use: #51cf66;
    --f-meaning: #ffa94d; --f-bounds: #ff6b6b; --f-workflow: #b197fc; --f-message: #ff922b; --f-mention: #5c636a; --f-topic: #5c636a; --f-meta: #495057; --f-personal: #fcc419; --f-other: #868e96;
    --b-observed: #51cf66; --b-stated: #4dabf7; --b-inferred: #da77f2; --b-imported: #3bc9db; --b-intuited: #ffa94d;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1b1e23; --ink: #e9ecef; --muted: #9aa0a8; --line: #2c3036; --soft: #23272d;
  --accent: #748ffc; --fresh: #ff922b;
  --k-repo: #748ffc; --k-concept: #f06595; --k-project: #51cf66; --k-site: #3bc9db; --k-post: #ff922b; --k-stage: #b197fc; --k-dataset: #f783ac; --k-account: #868e96; --k-topic: #868e96; --k-owner: #5c636a; --k-person: #ffa94d; --k-other: #adb5bd;
  --f-capability: #748ffc; --f-taxonomy: #f06595; --f-peer: #9775fa; --f-lineage: #3bc9db; --f-use: #51cf66;
  --f-meaning: #ffa94d; --f-bounds: #ff6b6b; --f-workflow: #b197fc; --f-message: #ff922b; --f-mention: #5c636a; --f-topic: #5c636a; --f-meta: #495057; --f-personal: #fcc419; --f-other: #868e96;
  --b-observed: #51cf66; --b-stated: #4dabf7; --b-inferred: #da77f2; --b-imported: #3bc9db; --b-intuited: #ffa94d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.tabs { display: flex; gap: 6px; }
.search { margin-left: auto; position: relative; }
.search input { width: 260px; max-width: 60vw; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
.results { position: absolute; right: 0; top: 36px; width: 340px; max-height: 360px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 20; display: none; }
.results div { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--soft); }
.results div:hover { background: var(--soft); }
main { display: grid; grid-template-columns: 210px 1fr 380px; min-height: 0; }
aside { background: var(--panel); overflow: auto; min-height: 0; }
#filters { border-right: 1px solid var(--line); padding: 12px; }
#detail { border-left: 1px solid var(--line); padding: 14px 16px; }
#stage { position: relative; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow: auto; display: none; }
.view.active { display: block; }
#cy { position: absolute; inset: 0; }
#gbar { position: absolute; top: 10px; left: 10px; z-index: 5; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
#gbar button { padding: 4px 10px; font-size: 13px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
h3:first-child { margin-top: 0; }
label.chk { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; user-select: none; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.sw.line { border-radius: 2px; height: 4px; width: 16px; }
.count { color: var(--muted); margin-left: auto; font-size: 12px; }
footer { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); }
footer input[type=range] { flex: 1; accent-color: var(--accent); }
#tlabel { min-width: 0; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
#tlabel b { color: var(--ink); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; line-height: 17px; margin-left: 4px; white-space: nowrap; }
.kind { color: #fff; border: none; }
.dname { font-size: 18px; font-weight: 700; margin: 0 0 2px; word-break: break-word; }
.dmeta { color: var(--muted); font-size: 12px; margin-bottom: 10px; word-break: break-all; }
.summary { background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 8px 0 12px; }
.slot { margin: 10px 0; }
.slot .sl { font-weight: 600; font-size: 13px; }
.claim { padding: 3px 0 3px 10px; border-left: 2px solid var(--line); margin: 3px 0; font-size: 13px; word-break: break-word; }
.claim .why { color: var(--muted); font-size: 12px; }
.claim.old { opacity: .55; text-decoration: line-through; }
.frontier { color: var(--muted); }
.frontier li { margin: 2px 0; }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.empty { color: var(--muted); padding: 30px; text-align: center; }
/* clusters */
.clusters { padding: 16px; display: grid; gap: 18px; }
.group h2 { font-size: 15px; margin: 0 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.card .ct { font-weight: 600; cursor: pointer; color: var(--k-concept); }
.card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--soft); cursor: pointer; }
.chip:hover { outline: 1px solid var(--accent); }
.chip.fresh, .fresh-row { outline: 2px solid var(--fresh); }
/* comprehension */
.comp { padding: 16px; }
.comp table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.comp th, .comp td { padding: 5px 8px; border-bottom: 1px solid var(--soft); text-align: left; font-size: 12px; }
.comp th.rot { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 500; color: var(--muted); height: 120px; vertical-align: bottom; }
.comp td.n { cursor: pointer; font-weight: 600; font-size: 13px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--muted); }
.dot.f { border: none; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 140px; }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }
/* history */
.hist { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.commit { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.commit.cur { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.commit .cm { font-weight: 600; }
.commit .cx { color: var(--muted); font-size: 12px; }
.changes .claim { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  #filters { border-right: none; border-bottom: 1px solid var(--line); max-height: 160px; }
  #detail { border-left: none; border-top: 1px solid var(--line); }
  .hist { grid-template-columns: 1fr; }
  .search input { width: 160px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">mneme<small id="hinfo"></small></div>
  <nav class="tabs" id="tabs">
    <button data-v="graph" class="on">Graph</button>
    <button data-v="clusters">Clusters</button>
    <button data-v="comp">Comprehension</button>
    <button data-v="hist">History</button>
  </nav>
  <div class="search"><input id="q" placeholder="Search anchors…" autocomplete="off"><div class="results" id="res"></div></div>
  <button id="theme" title="Toggle theme">◐</button>
</header>
<main>
  <aside id="filters"></aside>
  <section id="stage">
    <div class="view active" id="v-graph"><div id="cy"></div></div>
    <div class="view" id="v-clusters"></div>
    <div class="view" id="v-comp"></div>
    <div class="view" id="v-hist"></div>
  </section>
  <aside id="detail"><div class="empty">Select something to see what the memory knows about it — slot by slot, with evidence, and what it does not yet know.</div></aside>
</main>
<footer>
  <button id="prev" title="Previous commit">◀</button>
  <input type="range" id="t" min="0" max="0" value="0" aria-label="Commit">
  <button id="next" title="Next commit">▶</button>
  <button id="latest">Latest</button>
  <div id="tlabel"></div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script>
window.MNEME = /*MNEME_DATA*/null;
</script>
<script>
(function () {
'use strict';
const D = window.MNEME;
if (!D) { document.body.innerHTML = '<p class="empty">No data. Run <code>mneme build</code>.</p>'; return; }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const A = new Map(D.anchors.map(a => [a.id, a]));
const S = new Map(D.sources.map(s => [s.id, s]));
const FR = new Map(D.frames.map(f => [f.kind, f]));
const N = D.commits.length;
let T = N - 1, view = 'graph', selected = null;
const KINDS = [...new Set(D.anchors.map(a => a.kind))].sort();
const FAMS = [...new Set(D.claims.map(c => c.family))].sort((a, b) => D.meta.families.indexOf(a) - D.meta.families.indexOf(b));
const BASES = ['observed', 'stated', 'inferred', 'imported', 'intuited'].filter(b => D.claims.some(c => c.basis === b));
const show = {
  kinds: new Set(KINDS.filter(k => !['topic', 'owner', 'person', 'account'].includes(k))),
  fams: new Set(FAMS.filter(f => !['meta', 'topic', 'personal', 'mention'].includes(f))),
  bases: new Set(BASES),
};
const kindColor = k => css('--k-' + k) || css('--k-other');
const famColor = f => css('--f-' + f) || css('--f-other');
const basisColor = b => css('--b-' + b);
const nameOf = id => (A.get(id) || {}).name || id;
const shortName = a => a.kind === 'repo' ? a.name.split('/').pop() : a.name;

// ---- time-indexed state ----
const statusAt = (c, t) => c.introduced > t ? null : (c.changed != null && c.changed <= t ? c.status : 'active');
let cur = null;
function computeState() {
  const active = [], byAbout = new Map(), byTarget = new Map(), history = new Map();
  for (const c of D.claims) {
    const st = statusAt(c, T);
    if (st == null) continue;
    if (!history.has(c.about)) history.set(c.about, []);
    history.get(c.about).push({ c, st });
    if (st !== 'active') continue;
    active.push(c);
    (byAbout.get(c.about) || byAbout.set(c.about, []).get(c.about)).push(c);
    if (c.vk === 'anchor') (byTarget.get(c.v) || byTarget.set(c.v, []).get(c.v)).push(c);
  }
  // a thing is present when it entered memory and something active is still said about or to it
  const alive = new Set(D.anchors.filter(a => a.introduced <= T && (byAbout.has(a.id) || byTarget.has(a.id))).map(a => a.id));
  cur = { active, byAbout, byTarget, history, alive };
}
function profile(id) {
  const a = A.get(id); const f = a && FR.get(a.kind); if (!f) return null;
  const out = (cur.byAbout.get(id) || []), inn = (cur.byTarget.get(id) || []);
  return f.slots.map(s => ({ slot: s, claims: s.relations.flatMap(r => r.startsWith('in:') ? inn.filter(c => c.relation === r.slice(3)) : out.filter(c => c.relation === r)) }));
}
const coverage = p => p && p.length ? p.filter(x => x.claims.length).length / p.length : 0;
const BRANK = { observed: 0, stated: 1, imported: 2, inferred: 3, intuited: 4 };
const bestBasis = cs => cs.slice().sort((a, b) => BRANK[a.basis] - BRANK[b.basis])[0].basis;

// ---- filters panel ----
function renderFilters() {
  const kc = k => D.anchors.filter(a => a.kind === k && cur.alive.has(a.id)).length;
  const fc = f => cur.active.filter(c => c.family === f).length;
  const box = (set, key, label, swatch, count) => `<label class="chk"><input type="checkbox" data-set="${set}" data-key="${esc(key)}" ${show[set].has(key) ? 'checked' : ''}>${swatch}${esc(label)}<span class="count">${count}</span></label>`;
  document.getElementById('filters').innerHTML =
    '<h3>Things (anchors)</h3>' + KINDS.map(k => box('kinds', k, k, `<span class="sw" style="background:${kindColor(k)}"></span>`, kc(k))).join('') +
    '<h3>Links (edge layers)</h3>' + FAMS.map(f => box('fams', f, f, `<span class="sw line" style="background:${famColor(f)}"></span>`, fc(f))).join('') +
    '<h3>Basis</h3>' + BASES.map(b => box('bases', b, b, `<span class="sw" style="background:${basisColor(b)}"></span>`, cur.active.filter(c => c.basis === b).length)).join('') +
    '<h3>Reading the graph</h3><div class="dmeta">Solid edge = observed / stated. Dashed = inferred. Orange ring = added in the selected commit. Drag the slider to travel through the memory\'s history.</div>';
}
document.getElementById('filters').addEventListener('change', e => {
  const i = e.target; if (!i.dataset.set) return;
  i.checked ? show[i.dataset.set].add(i.dataset.key) : show[i.dataset.set].delete(i.dataset.key);
  if (i.dataset.set === 'kinds') { applyVisibility(); relayout(); } else applyVisibility();
  renderView();
});

// ---- graph view ----
// Three layouts of the same memory:
//   map     — nested boxes (category → concept → repos); edges only for the selection
//   network — free force layout of everything visible, all edge layers
//   focus   — only the selection and its neighbours, in rings
let cy = null, mode = 'map', focusOn = false;
const HAS_FCOSE = () => typeof cytoscape !== 'undefined' && cytoscape('layout', 'fcose');
const IMPLIED = new Set(['part_of']); // shown by nesting in map mode
let mapParent = new Map();
function computeMapParents() {
  // Primary home of each thing: concept → its strongest part_of; repo → its strongest provides.
  mapParent = new Map();
  const best = new Map();
  for (const c of D.claims) {
    if (c.status !== 'active' || c.vk !== 'anchor' || !A.has(c.v)) continue;
    const a = A.get(c.about); if (!a) continue;
    const ok = (['concept', 'stage'].includes(a.kind) && c.relation === 'part_of') || (['repo', 'site', 'post', 'dataset'].includes(a.kind) && c.relation === 'provides');
    if (!ok) continue;
    const s = c.confidence ?? 0.9;
    if (!best.has(a.id) || s > best.get(a.id)) { best.set(a.id, s); mapParent.set(a.id, c.v); }
  }
  for (const a of D.anchors) if (a.kind === 'project') mapParent.set(a.id, 'group:projects');
}
function impliedEdge(c) { return mode === 'map' && (IMPLIED.has(c.relation) || mapParent.get(c.about) === c.v); }
function buildGraph() {
  if (typeof cytoscape === 'undefined') {
    document.getElementById('cy').innerHTML = '<div class="empty">Graph library could not load (offline?). The other views still work.</div>';
    return;
  }
  if (cy) cy.destroy();
  const deg = new Map();
  for (const c of D.claims) if (c.vk === 'anchor' && c.status === 'active' && !['meta', 'topic', 'personal'].includes(c.family)) {
    deg.set(c.about, (deg.get(c.about) || 0) + 1); deg.set(c.v, (deg.get(c.v) || 0) + 1);
  }
  const els = [];
  if (mode === 'map' && !focusOn) els.push({ group: 'nodes', data: { id: 'group:projects', label: 'Your projects', kind: 'group', color: kindColor('project'), size: 20 } });
  for (const a of D.anchors) {
    const d = { id: a.id, label: shortName(a), kind: a.kind, color: kindColor(a.kind), size: mode === 'map' ? 16 : 14 + Math.min(46, Math.sqrt(deg.get(a.id) || 0) * 7) };
    if (mode === 'map' && !focusOn && mapParent.has(a.id)) d.parent = mapParent.get(a.id);
    els.push({ group: 'nodes', data: d });
  }
  for (const c of D.claims) if (c.vk === 'anchor' && A.has(c.about) && A.has(c.v))
    els.push({ group: 'edges', data: { id: c.id, source: c.about, target: c.v, color: famColor(c.family), w: 0.8 + 2 * (c.confidence ?? 0.9) }, classes: c.basis === 'inferred' || c.basis === 'intuited' ? 'inf' : '' });
  const ink = css('--ink'), bg = css('--bg');
  cy = cytoscape({
    container: document.getElementById('cy'), elements: els, minZoom: 0.05, maxZoom: 4, wheelSensitivity: 0.25,
    style: [
      { selector: 'node', style: { 'background-color': 'data(color)', width: 'data(size)', height: 'data(size)', label: 'data(label)', 'font-size': 14, color: ink, 'text-valign': 'bottom', 'text-margin-y': 3, 'text-outline-width': 2.5, 'text-outline-color': bg, 'min-zoomed-font-size': 6, 'text-wrap': 'ellipsis', 'text-max-width': 110 } },
      { selector: 'node[kind="concept"]', style: { shape: 'round-diamond', 'font-weight': 700, 'font-size': 13, 'min-zoomed-font-size': 4 } },
      { selector: 'node[kind="project"]', style: { shape: 'round-rectangle', 'font-weight': 700, 'font-size': 14, 'min-zoomed-font-size': 3 } },
      { selector: ':parent', style: { shape: 'round-rectangle', 'background-color': 'data(color)', 'background-opacity': 0.07, 'border-width': 1.5, 'border-color': 'data(color)', 'border-opacity': 0.55, padding: 14, 'text-valign': 'top', 'text-halign': 'center', 'text-margin-y': -4, 'font-size': 'data(fs)', 'font-weight': 700, color: 'data(color)', 'min-zoomed-font-size': 2, 'text-max-width': 2000 } },
      { selector: 'edge', style: { width: 'data(w)', 'line-color': 'data(color)', 'target-arrow-color': 'data(color)', 'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier', opacity: mode === 'network' ? 0.35 : 0.85, label: '' } },
      { selector: 'edge.inf', style: { 'line-style': 'dashed', 'line-dash-pattern': [5, 4] } },
      { selector: 'edge.named', style: { label: 'data(rel)', 'font-size': 9, color: ink, 'text-rotation': 'autorotate', 'text-outline-width': 2, 'text-outline-color': bg, 'min-zoomed-font-size': 6 } },
      { selector: '.hidden', style: { display: 'none' } },
      { selector: 'node.fresh', style: { 'border-width': 3, 'border-color': css('--fresh') } },
      { selector: 'edge.fresh', style: { opacity: 0.95, width: 3 } },
      { selector: '.faded', style: { opacity: 0.12 } },
      { selector: 'node.sel', style: { 'border-width': 4, 'border-color': css('--accent'), 'font-size': 16, 'min-zoomed-font-size': 0 } },

// Deterministic nested shelf-packing: leaves in tidy rows inside their box, boxes in rows inside
// their parent box. Returns centre positions for leaves; compound boxes size around them.
function packMap() {
  const CELL = { w: 132, h: 58 }, PAD = 18, LABEL = 26, GAP = 22;

  function shelf(items, minW) {
    const area = items.reduce((s, it) => s + it.w * it.h, 0);
    const maxW = Math.max(minW, ...items.map(i => i.w), Math.sqrt(area) * 1.6);
    let x = 0, y = 0, rowH = 0, W = 0;
    for (const it of items) {
      if (x > 0 && x + it.w > maxW) { y += rowH + GAP; x = 0; rowH = 0; }
      it.x = x; it.y = y; x += it.w + GAP; rowH = Math.max(rowH, it.h); W = Math.max(W, x - GAP);

    return { w: W, h: y + rowH };
  }

    const ch = kids.get(id);
    if (!ch) return { id, w: CELL.w, h: CELL.h, leaf: true };
    const items = ch.map(c => measure(c, depth + 1));
    // boxes first (largest first), then single things alphabetically
    items.sort((a, b) => (a.leaf - b.leaf) || (a.leaf ? label(a.id).localeCompare(label(b.id)) : b.w * b.h - a.w * a.h));
    const inner = shelf(items, CELL.w * 3);

    const box = { id, w: Math.max(inner.w + PAD * 2, titleW), h: inner.h + PAD * 2 + LABEL + (depth ? 0 : 24), off: PAD + LABEL + (depth ? 0 : 24), items };

    if (it.leaf) { pos.set(it.id, { x: ox + it.x + CELL.w / 2, y: oy + it.y + CELL.h / 2 }); return; }

}

};
